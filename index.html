                <h3 className="text-3xl font-black text-amber-500 mb-6 border-b border-slate-800 pb-4">Fundamentos de la Flexión Nominal</h3>
                <p className="text-slate-300 leading-relaxed mb-8 font-light text-lg">

                    <ul className="space-y-4 text-base text-slate-300 font-light">
                      <li className="flex flex-col"><strong className="text-emerald-300 uppercase tracking-widest text-xs mb-1">Nominativo (El actor)</strong> Sirve para el <em>Sujeto</em> y el <em>Atributo</em>. Nombra al que realiza la acción.</li>

                      <li className="flex flex-col"><strong className="text-emerald-300 uppercase tracking-widest text-xs mb-1">Dativo (El receptor)</strong> Expresa el <em>Complemento Indirecto</em> (beneficiario), el instrumento y lugar.</li>

                      <h4 className="text-xl font-bold text-blue-400 mb-3 flex items-center"><span className="text-2xl mr-3">⚧️</span> Género y Número</h4>
                      <p className="text-sm text-slate-300 font-light leading-relaxed">

        // ==========================================
        // 7. PREGUNTA 5: LITERATURA
        // ==========================================
        function Pregunta5() {
          const [score, setScore] = useState(0);
          const [answered, setAnswered] = useState(Array(quizData.length).fill(null));

          const handleAnswer = (qIndex, oIndex) => {
            if (answered[qIndex] !== null) return; 
            const newAnswered = [...answered];
            newAnswered[qIndex] = oIndex;
            setAnswered(newAnswered);
            
            if (oIndex === quizData[qIndex].answer) {
              setScore(s => s + 1);
            }
          };

          const getOptionClass = (qIndex, oIndex) => {
            const ans = answered[qIndex];
            const isCorrect = quizData[qIndex].answer === oIndex;
            
            if (ans === null) return "bg-slate-900 hover:bg-slate-800 text-slate-300 border-slate-700 hover:border-blue-500/50";
            if (isCorrect) return "bg-emerald-900/90 text-emerald-100 border-emerald-400 shadow-[0_0_15px_rgba(16,185,129,0.3)] font-bold";
            if (ans === oIndex && !isCorrect) return "bg-red-900/90 text-red-100 border-red-500";
            return "bg-slate-950 text-slate-600 border-slate-900 opacity-40";
          };

          return (
            <div className="space-y-12 animate-fade-in pb-10">
              <header className="border-b border-slate-800 pb-6 flex flex-col md:flex-row justify-between md:items-end gap-6">
                <div>
                  <h2 className="text-3xl font-black text-white mb-2">5. Literatura Griega</h2>
                  <p className="text-slate-400 text-base font-light">Cuestionario con retroalimentación y curiosidades históricas.</p>
                </div>
                <div className="bg-slate-900 px-6 py-3 rounded-2xl border border-slate-800 flex items-center space-x-4 shadow-xl">
                  <span className="text-slate-500 text-sm uppercase tracking-widest font-black">Puntuación Total</span>
                  <span className="text-3xl font-black text-amber-500">{score}<span className="text-xl text-slate-600 font-normal">/10</span></span>
                </div>
              </header>

              <div className="grid xl:grid-cols-2 gap-8">
                {quizData.map((q, qIndex) => (
                  <div key={qIndex} className="bg-slate-900 p-8 rounded-3xl border border-slate-800 shadow-xl flex flex-col justify-between relative transition-all duration-300">
                    <div className="absolute top-0 right-0 p-4 opacity-5 pointer-events-none text-7xl font-serif font-black">
                      {qIndex + 1}
                    </div>
                    <div className="relative z-10">
                      <h3 className="text-xl font-medium text-white mb-6 leading-relaxed">{q.q}</h3>
                      <div className="grid grid-cols-1 gap-3">
                        {q.options.map((opt, oIndex) => (
                          <button
                            key={oIndex}
                            onClick={() => handleAnswer(qIndex, oIndex)}
                            disabled={answered[qIndex] !== null}
                            className={`p-4 rounded-xl text-left transition-all duration-300 border-2 flex items-center group ${getOptionClass(qIndex, oIndex)}`}
                          >
                            <span className={`font-black mr-4 w-8 h-8 flex-shrink-0 flex items-center justify-center rounded-lg text-sm ${answered[qIndex] === null ? 'bg-slate-800 text-slate-400 group-hover:bg-blue-500 group-hover:text-white' : 'bg-black/30 text-white/90'}`}>
                              {['A', 'B', 'C', 'D'][oIndex]}
                            </span>
                            <span className="text-lg">{opt}</span>
                            
                            {answered[qIndex] !== null && quizData[qIndex].answer === oIndex && (
                              <svg className="w-6 h-6 ml-auto text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={3} d="M5 13l4 4L19 7" /></svg>
                            )}
                            {answered[qIndex] === oIndex && quizData[qIndex].answer !== oIndex && (
                              <svg className="w-6 h-6 ml-auto text-red-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={3} d="M6 18L18 6M6 6l12 12" /></svg>
                            )}
                          </button>
                        ))}
                      </div>
                    </div>
                    
                    <div className={`mt-6 overflow-hidden transition-all duration-[800ms] ease-in-out ${answered[qIndex] !== null ? 'max-h-[600px] opacity-100' : 'max-h-0 opacity-0'}`}>
                      <div className="bg-slate-950 p-6 rounded-xl border-l-4 border-blue-500 mt-4 mb-3 relative">
                        <p className="text-blue-400 font-black uppercase tracking-widest text-xs mb-2">Contexto Histórico</p>
                        <p className="text-slate-300 text-sm leading-relaxed font-light">{q.explanation}</p>
                      </div>
                      <div className="bg-slate-950 p-6 rounded-xl border-l-4 border-amber-500 relative">
                        <p className="text-amber-500 font-black uppercase tracking-widest text-xs mb-2">Dato Curioso</p>
                        <p className="text-slate-300 text-sm leading-relaxed font-light italic">{q.curiosity}</p>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          );
        }

                  ))}

              <main className="flex-1 overflow-y-auto h-screen relative bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-slate-950 scroll-smooth">
                <div className="absolute inset-0 opacity-[0.03] pointer-events-none" style={{ backgroundImage: 'url("data:image/svg+xml,%3Csvg width=\'60\' height=\'60\' viewBox=\'0 0 60 60\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cg fill=\'none\' fill-rule=\'evenodd\'%3E%3Cg fill=\'%23ffffff\' fill-opacity=\'1\'%3E%3Cpath d=\'M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z\'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E")' }}></div>
                
                <div className="max-w-6xl mx-auto relative z-10 p-6 md:p-12 pb-20">
                  {activeTab === 1 && <MorfologiaNominal />}
                  {activeTab === 2 && <Pregunta2 />}
                  {activeTab === 3 && <SistemaVerbal />}

                  {activeTab === 5 && <Pregunta5 />}

          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
