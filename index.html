                <div className="bg-slate-900 px-6 py-3 rounded-2xl border border-slate-800 flex items-center space-x-4 shadow-xl">
                  <span className="text-slate-500 text-sm uppercase tracking-widest font-black">Puntuación Total</span>
                  <span className="text-3xl font-black text-amber-500">{score}<span className="text-xl text-slate-600 font-normal">/10</span></span>
                </div>
              </header>

              <div className="grid xl:grid-cols-2 gap-8">
                {quizData.map((q, qIndex) => (
                  <div key={qIndex} className="bg-slate-900 p-8 rounded-3xl border border-slate-800 shadow-xl flex flex-col justify-between relative transition-all duration-300">
                    <div className="absolute top-0 right-0 p-4 opacity-5 pointer-events-none text-7xl font-serif font-black">
                      {qIndex + 1}
                    </div>
                    <div className="relative z-10">
                      <h3 className="text-xl font-medium text-white mb-6 leading-relaxed">{q.q}</h3>
                      <div className="grid grid-cols-1 gap-3">
                        {q.options.map((opt, oIndex) => (
                          <button
                            key={oIndex}
                            onClick={() => handleAnswer(qIndex, oIndex)}
                            disabled={answered[qIndex] !== null}
                            className={`p-4 rounded-xl text-left transition-all duration-300 border-2 flex items-center group ${getOptionClass(qIndex, oIndex)}`}
                          >
                            <span className={`font-black mr-4 w-8 h-8 flex-shrink-0 flex items-center justify-center rounded-lg text-sm ${answered[qIndex] === null ? 'bg-slate-800 text-slate-400 group-hover:bg-blue-500 group-hover:text-white' : 'bg-black/30 text-white/90'}`}>
                              {['A', 'B', 'C', 'D'][oIndex]}
                            </span>
                            <span className="text-lg">{opt}</span>
                            
                            {answered[qIndex] !== null && quizData[qIndex].answer === oIndex && (
                              <svg className="w-6 h-6 ml-auto text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={3} d="M5 13l4 4L19 7" /></svg>
                            )}
                            {answered[qIndex] === oIndex && quizData[qIndex].answer !== oIndex && (
                              <svg className="w-6 h-6 ml-auto text-red-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={3} d="M6 18L18 6M6 6l12 12" /></svg>
                            )}
                          </button>
                        ))}
                      </div>
                    </div>
                    
                    <div className={`mt-6 overflow-hidden transition-all duration-[800ms] ease-in-out ${answered[qIndex] !== null ? 'max-h-[600px] opacity-100' : 'max-h-0 opacity-0'}`}>
                      <div className="bg-slate-950 p-6 rounded-xl border-l-4 border-blue-500 mt-4 mb-3 relative">
                        <p className="text-blue-400 font-black uppercase tracking-widest text-xs mb-2">Contexto Histórico</p>
                        <p className="text-slate-300 text-sm leading-relaxed font-light">{q.explanation}</p>
                      </div>
                      <div className="bg-slate-950 p-6 rounded-xl border-l-4 border-amber-500 relative">
                        <p className="text-amber-500 font-black uppercase tracking-widest text-xs mb-2">Dato Curioso</p>
                        <p className="text-slate-300 text-sm leading-relaxed font-light italic">{q.curiosity}</p>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          );
        }

        // ==========================================
        // 8. PREGUNTA 6: ETIMOLOGÍA
        // ==========================================
        function Pregunta6() {
          const derivados = [
            { hel: "ἄνθρωπος (hombre)", der: ["Antropología", "Filántropo", "Licántropo"], icon: "👤" },
            { hel: "θεός (dios)", der: ["Teología", "Ateo", "Politeísmo"], icon: "⚡" },
            { hel: "πόλεμος (guerra)", der: ["Polémica", "Polemista", "Polemología"], icon: "⚔️" },
            { hel: "πῦρ, πυρός (fuego)", der: ["Pirómano", "Pirotecnia", "Antipirético"], icon: "🔥" },
            { hel: "φίλος (amigo)", der: ["Filosofía", "Filología", "Pedófilo"], icon: "🤝" },
            { hel: "χρόνος (tiempo)", der: ["Cronología", "Cronómetro", "Anacrónico"], icon: "⏳" },
            { hel: "χρυσός (oro)", der: ["Crisantemo", "Crisálida", "Crisoelefantino"], icon: "✨" },
            { hel: "γῆ (tierra)", der: ["Geografía", "Geología", "Apogeo"], icon: "🌍" },
            { hel: "ὕδωρ, ὕδατος (agua)", der: ["Hidráulica", "Deshidratar", "Clepsidra"], icon: "💧" },
            { hel: "ψυχή (alma)", der: ["Psicología", "Psiquiatra", "Metempsicosis"], icon: "🧠" },
            { hel: "ἰατρός (médico)", der: ["Pediatra", "Psiquiatra", "Iatrogénico"], icon: "⚕️" },
            { hel: "δήμος (pueblo)", der: ["Democracia", "Demografía", "Endémico"], icon: "🏛️" },
          ];

          return (
            <div className="space-y-12 animate-fade-in pb-10">
              <header className="border-b border-slate-800 pb-6">
                <h2 className="text-3xl font-black text-white mb-2">6. Etimología y Helenismos</h2>
                <p className="text-slate-400 text-base font-light">Pasa el ratón sobre cada lexema griego para desvelar su legado léxico en el castellano.</p>
              </header>

              <div className="grid sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                {derivados.map((item, idx) => (
                  <div key={idx} className="group perspective bg-transparent h-64 cursor-pointer">
                    <div className="relative preserve-3d w-full h-full duration-700 group-hover:rotate-y-180 shadow-xl rounded-3xl">
                      
                      <div className="absolute backface-hidden w-full h-full bg-slate-900 rounded-3xl border border-slate-800 flex flex-col justify-center items-center p-6 shadow-inner">
                        <span className="text-5xl mb-4 opacity-80 group-hover:scale-110 transition-transform">{item.icon}</span>
                        <span className="text-3xl font-serif text-amber-500 mb-2 font-bold greek-text text-center">{item.hel.split(' ')[0]}</span>
                        <span className="text-slate-400 font-medium text-sm">{item.hel.substring(item.hel.indexOf('('))}</span>
                      </div>

                      <div className="absolute w-full h-full rounded-3xl rotate-y-180 overflow-hidden" style={{ backfaceVisibility: 'hidden', transform: 'rotateY(180deg)' }}>
                        <div className="w-full h-full bg-slate-800 border-2 border-amber-500 flex flex-col justify-center items-center p-6 relative">
                          <h4 className="text-amber-500 text-xs uppercase tracking-widest mb-4 font-black border-b border-amber-500/30 pb-2 w-full text-center">Derivados</h4>
                          <ul className="space-y-2 w-full">
                            {item.der.map((palabra, pIdx) => (
                              <li key={pIdx} className="bg-slate-900 px-3 py-2 rounded-lg text-slate-200 font-medium text-center shadow-sm border border-slate-700 text-sm">
                                {palabra}
                              </li>
                            ))}
                          </ul>
                        </div>
                      </div>

                    </div>
                  </div>
                ))}
              </div>
            </div>
          );
        }

        // ==========================================
        // MAIN APP COMPONENT
        // ==========================================
        function App() {
          const [activeTab, setActiveTab] = useState(1);

          const menuItems = [
            { id: 1, title: "Morfología Nominal", icon: "🏛️" },
            { id: 2, title: "Análisis Profundo", icon: "📖" },
            { id: 3, title: "Sistema Verbal", icon: "⚙️" },
            { id: 4, title: "Traducción Textual", icon: "📜" },
            { id: 5, title: "Literatura Griega", icon: "🎭" },
            { id: 6, title: "Etimología", icon: "🌳" }
          ];

          return (
            <div className="h-screen flex flex-col md:flex-row overflow-hidden bg-slate-950">
              
              <nav className="w-full md:w-72 bg-slate-900 border-r border-slate-800 shadow-2xl flex-shrink-0 flex flex-col z-20 relative">
                <div className="p-8 pb-5 border-b border-slate-800 bg-slate-950/30">
                  <div className="w-12 h-12 bg-amber-500 rounded-xl flex items-center justify-center mb-4 shadow-[0_0_20px_rgba(245,158,11,0.3)]">
                    <span className="text-2xl font-serif text-slate-950 font-black">ΑΩ</span>
                  </div>
                  <h1 className="text-2xl font-black text-amber-500 tracking-wider uppercase mb-1">GRIEGO II</h1>
                  <p className="text-sm text-slate-400 font-medium tracking-wide">Resolución Tarea 3</p>
                </div>
                <ul className="space-y-2 p-4 flex-1 overflow-y-auto">
                  {menuItems.map((tab) => (
                    <li key={tab.id}>
                      <button
                        onClick={() => setActiveTab(tab.id)}
                        className={`w-full flex items-center px-4 py-4 rounded-xl transition-all duration-300 font-bold text-sm group ${
                          activeTab === tab.id 
                            ? "bg-slate-800 text-amber-400 shadow-lg border border-slate-700/80" 
                            : "hover:bg-slate-800/40 text-slate-400 hover:text-slate-200 border border-transparent"
                        }`}
                      >
                        <span className={`text-xl mr-3 transition-transform duration-300 ${activeTab === tab.id ? 'scale-110 drop-shadow-md' : 'group-hover:scale-110'}`}>{tab.icon}</span>
                        <span className="tracking-wide">{tab.title}</span>
                        {activeTab === tab.id && (
                          <div className="ml-auto w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse shadow-[0_0_8px_#facc15]"></div>
                        )}
                      </button>
                    </li>
                  ))}
                </ul>
              </nav>

              <main className="flex-1 overflow-y-auto h-screen relative bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-slate-950 scroll-smooth">
                <div className="absolute inset-0 opacity-[0.03] pointer-events-none" style={{ backgroundImage: 'url("data:image/svg+xml,%3Csvg width=\'60\' height=\'60\' viewBox=\'0 0 60 60\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cg fill=\'none\' fill-rule=\'evenodd\'%3E%3Cg fill=\'%23ffffff\' fill-opacity=\'1\'%3E%3Cpath d=\'M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z\'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E")' }}></div>
                
                <div className="max-w-6xl mx-auto relative z-10 p-6 md:p-12 pb-20">
                  {activeTab === 1 && <MorfologiaNominal />}
                  {activeTab === 2 && <Pregunta2 />}
                  {activeTab === 3 && <SistemaVerbal />}
                  {activeTab === 4 && <Pregunta4 />}
                  {activeTab === 5 && <Pregunta5 />}
                  {activeTab === 6 && <Pregunta6 />}
                </div>
              </main>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
