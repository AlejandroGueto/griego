                        {q.options.map((opt, oIndex) => (
                          <button
                            key={oIndex}
                            onClick={() => handleAnswer(qIndex, oIndex)}
                            disabled={answered[qIndex] !== null}
                            className={`p-5 rounded-xl text-left transition-all duration-300 border-2 flex items-center group ${getOptionClass(qIndex, oIndex)}`}
                          >
                            <span className={`font-bold mr-4 w-10 h-10 flex items-center justify-center rounded-lg transition-colors ${answered[qIndex] === null ? 'bg-slate-800 text-slate-400 group-hover:bg-blue-500 group-hover:text-white' : 'bg-black/20 text-white/80'}`}>
                              {['A', 'B', 'C', 'D'][oIndex]}
                            </span>
                            <span className="text-xl">{opt}</span>
                            
                            {answered[qIndex] !== null && quizData[qIndex].answer === oIndex && (
                              <svg className="w-8 h-8 ml-auto text-emerald-400 drop-shadow-md" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={3} d="M5 13l4 4L19 7" /></svg>
                            )}
                            {answered[qIndex] === oIndex && quizData[qIndex].answer !== oIndex && (
                              <svg className="w-8 h-8 ml-auto text-red-400 drop-shadow-md" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={3} d="M6 18L18 6M6 6l12 12" /></svg>
                            )}
                          </button>
                        ))}
                      </div>
                    </div>
                    
                    <div className={`mt-6 overflow-hidden transition-all duration-700 ease-in-out ${answered[qIndex] !== null ? 'max-h-64 opacity-100' : 'max-h-0 opacity-0'}`}>
                      <div className="bg-slate-950 p-6 rounded-xl border-l-4 border-amber-500 shadow-inner mt-4">
                        <p className="text-amber-500 font-bold uppercase tracking-widest text-xs mb-2">Contexto Histórico</p>
                        <p className="text-slate-300 text-lg leading-relaxed">{q.explanation}</p>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          );
        }

        function Pregunta6() {
          const derivados = [
            { hel: "ἄνθρωπος (hombre)", der: ["Antropología", "Filántropo", "Licántropo", "Misántropo"], icon: "👤" },
            { hel: "θεός (dios)", der: ["Teología", "Ateo", "Politeísmo", "Panteón"], icon: "⚡" },
            { hel: "πόλεμος (guerra)", der: ["Polémica", "Polemista", "Polemología"], icon: "⚔️" },
            { hel: "πῦρ, πυρός (fuego)", der: ["Pirómano", "Pirotecnia", "Antipirético"], icon: "🔥" },
            { hel: "φίλος (amigo)", der: ["Filosofía", "Filología", "Pedófilo", "Bibliofilia"], icon: "🤝" },
            { hel: "χρόνος (tiempo)", der: ["Cronología", "Cronómetro", "Sincronizar", "Anacrónico"], icon: "⏳" },
            { hel: "χρυσός (oro)", der: ["Crisantemo", "Crisálida", "Crisóstomo", "Crisoelefantino"], icon: "✨" },
            { hel: "γῆ (tierra)", der: ["Geografía", "Geología", "Apogeo", "Geometría"], icon: "🌍" },
            { hel: "ὕδωρ, ὕδατος (agua)", der: ["Hidráulica", "Hidrocarburo", "Deshidratar"], icon: "💧" },
            { hel: "ψυχή (alma)", der: ["Psicología", "Psiquiatra", "Psicosis", "Metempsicosis"], icon: "🧠" },
            { hel: "ἰατρός (médico)", der: ["Pediatra", "Psiquiatra", "Foniatra", "Iatrogénico"], icon: "⚕️" },
            { hel: "δήμος (pueblo)", der: ["Democracia", "Demografía", "Epidemia", "Endémico"], icon: "🏛️" },
          ];

          return (
            <div className="space-y-12 animate-fade-in">
              <header className="border-b border-slate-800 pb-6 mb-8 flex flex-col md:flex-row justify-between md:items-end gap-6">
                <div>
                  <h2 className="text-4xl font-bold text-white mb-2">6. Etimología y Helenismos</h2>
                  <p className="text-slate-400 text-lg">Pasa el ratón sobre cada lexema griego para desvelar su legado léxico en el castellano.</p>
                </div>
              </header>

              <div className="grid md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
                {derivados.map((item, idx) => (
                  <div key={idx} className="group perspective bg-transparent h-64 cursor-pointer">
                    <div className="relative preserve-3d w-full h-full duration-700 group-hover:rotate-y-180 shadow-2xl rounded-3xl">
                      
                      <div className="absolute backface-hidden w-full h-full bg-slate-900 rounded-3xl border border-slate-800 flex flex-col justify-center items-center p-8 shadow-[inset_0_0_40px_rgba(0,0,0,0.5)]">
                        <span className="text-6xl mb-4 opacity-80 group-hover:scale-110 transition-transform duration-500">{item.icon}</span>
                        <span className="text-4xl font-serif text-amber-500 mb-2 font-bold drop-shadow-md text-center">{item.hel.split(' ')[0]}</span>
                        <span className="text-slate-400 font-medium text-lg">{item.hel.substring(item.hel.indexOf('('))}</span>
                        <span className="absolute bottom-4 text-xs text-slate-500 uppercase tracking-widest group-hover:opacity-0 transition-opacity font-bold">Girar tarjeta</span>
                      </div>

                      <div className="absolute w-full h-full rounded-3xl rotate-y-180 overflow-hidden" style={{ backfaceVisibility: 'hidden', transform: 'rotateY(180deg)' }}>
                        <div className="w-full h-full bg-slate-800 border-2 border-amber-500 flex flex-col justify-center items-center p-6 shadow-[inset_0_0_50px_rgba(245,158,11,0.15)] relative">
                          <div className="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-amber-600 to-amber-400"></div>
                          <h4 className="text-amber-500 text-sm uppercase tracking-widest mb-4 font-bold border-b border-amber-500/30 pb-2 w-full text-center">Derivados</h4>
                          <ul className="space-y-3 w-full">
                            {item.der.map((palabra, pIdx) => (
                              <li key={pIdx} className="bg-slate-900/80 px-4 py-2 rounded-xl text-slate-200 font-medium text-center shadow-sm border border-slate-700 text-lg">
                                {palabra}
                              </li>
                            ))}
                          </ul>
                        </div>
                      </div>

                    </div>
                  </div>
                ))}
              </div>
            </div>
          );
        }

        function App() {
          const [activeTab, setActiveTab] = useState(1);

          return (
            <div className="min-h-screen flex flex-col md:flex-row overflow-hidden">
              
              <nav className="w-full md:w-72 bg-slate-900 border-r border-slate-800 shadow-2xl flex-shrink-0 flex flex-col z-20 relative">
                <div className="p-8 pb-4 border-b border-slate-800">
                  <div className="w-12 h-12 bg-amber-500 rounded-lg flex items-center justify-center mb-4 shadow-[0_0_15px_rgba(245,158,11,0.3)]">
                    <span className="text-2xl font-serif text-slate-900 font-bold">ΑΩ</span>
                  </div>
                  <h1 className="text-2xl font-bold text-amber-500 tracking-wider uppercase mb-1">GRIEGO II</h1>
                  <p className="text-sm text-slate-400 font-medium">Resolución Académica • Tarea 3</p>
                </div>
                <ul className="space-y-1 p-4 flex-1 overflow-y-auto">
                  {[
                    { id: 1, title: "Morfología Nominal", icon: "🏛️" },
                    { id: 2, title: "Declinaciones", icon: "📖" },
                    { id: 3, title: "Sistema Verbal", icon: "⚙️" },
                    { id: 4, title: "Análisis y Traducción", icon: "📜" },
                    { id: 5, title: "Literatura Griega", icon: "🎭" },
                    { id: 6, title: "Etimología", icon: "🌳" },
                  ].map((tab) => (
                    <li key={tab.id}>
                      <button
                        onClick={() => setActiveTab(tab.id)}
                        className={`w-full flex items-center px-4 py-4 rounded-xl transition-all duration-300 font-medium group ${
                          activeTab === tab.id 
                            ? "bg-slate-800/80 text-amber-400 shadow-lg border border-slate-700/50" 
                            : "hover:bg-slate-800/40 text-slate-400 hover:text-slate-200"
                        }`}
                      >
                        <span className={`text-xl mr-3 transition-transform duration-300 ${activeTab === tab.id ? 'scale-110' : 'group-hover:scale-110'}`}>{tab.icon}</span>
                        <span className="tracking-wide text-sm">{tab.title}</span>
                        {activeTab === tab.id && (
                          <div className="ml-auto w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse"></div>

                      </button>
                    </li>
                  ))}
                </ul>
                <div className="p-4 border-t border-slate-800 text-xs text-slate-500 text-center">
                  IES San José de la Rinconada
                </div>
              </nav>

              <main className="flex-1 p-6 md:p-12 overflow-y-auto h-screen relative bg-slate-950">
                <div className="max-w-6xl mx-auto relative z-10 pb-20">
                  {activeTab === 1 && <Pregunta1 />}
                  {activeTab === 2 && <Pregunta2 />}
                  {activeTab === 3 && <Pregunta3 />}
                  {activeTab === 4 && <Pregunta4 />}
                  {activeTab === 5 && <Pregunta5 />}
                  {activeTab === 6 && <Pregunta6 />}
                </div>
              </main>
            </div>
          );
        }

        // Renderizamos la aplicación en el div con id "root"
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
