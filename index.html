            {/* TEORÍA GENERAL MASIVA */}

              <h3 className="text-3xl font-black text-amber-500 mb-6 border-b border-slate-800 pb-4">Fundamentos de la Flexión Nominal</h3>

              <p className="text-slate-300 leading-relaxed mb-8 font-light text-lg">

                El griego antiguo es una lengua flexiva. Esto significa que las palabras (sustantivos, adjetivos y pronombres) no usan tantas preposiciones como el español, sino que <strong>alteran su terminación (desinencia)</strong> para indicar su función sintáctica en la oración. La parte invariable de la palabra se llama <em>raíz</em> o <em>tema</em>.

              </p>



              <div className="grid lg:grid-cols-2 gap-8 mb-8">

                <div className="bg-slate-950/80 p-8 rounded-3xl border border-slate-800 shadow-inner relative">

                  <h4 className="text-xl font-bold text-emerald-400 mb-4 flex items-center"><span className="text-2xl mr-3">🧭</span> Los 5 Casos y su Función</h4>

                  <p className="text-sm text-slate-400 mb-4">El caso es la forma que adopta la palabra para expresar su papel en la frase:</p>

                  <ul className="space-y-4 text-base text-slate-300 font-light">

                    <li className="flex flex-col"><strong className="text-emerald-300 uppercase tracking-widest text-xs mb-1">Nominativo (El actor)</strong> Sirve para el <em>Sujeto</em> y el <em>Atributo</em>. Nombra al que realiza la acción.</li>

                    <li className="flex flex-col"><strong className="text-emerald-300 uppercase tracking-widest text-xs mb-1">Vocativo (La llamada)</strong> Sirve para llamar la atención del oyente (apelación). Es independiente de la oración.</li>

                    <li className="flex flex-col"><strong className="text-emerald-300 uppercase tracking-widest text-xs mb-1">Acusativo (El límite)</strong> Expresa el <em>Complemento Directo</em> (lo que sufre la acción) y la <em>dirección</em> (con preposiciones).</li>

                    <li className="flex flex-col"><strong className="text-emerald-300 uppercase tracking-widest text-xs mb-1">Genitivo (El origen)</strong> Expresa el <em>Complemento del Nombre</em> (posesión, pertenencia, materia) y el punto de partida o separación.</li>

                    <li className="flex flex-col"><strong className="text-emerald-300 uppercase tracking-widest text-xs mb-1">Dativo (El receptor)</strong> Expresa el <em>Complemento Indirecto</em> (a quién beneficia el daño/provecho), el instrumento y el lugar.</li>

                  </ul>

                </div>



                <div className="space-y-8">

                  <div className="bg-slate-950/80 p-8 rounded-3xl border border-slate-800 shadow-inner relative">

                    <div className="absolute top-0 left-0 w-2 h-full bg-blue-500 rounded-l-3xl"></div>

      function Pregunta5() {

        const [score, setScore] = useState(0);

        const [answered, setAnswered] = useState(Array(quizData.length).fill(null));



        const handleAnswer = (qIndex, oIndex) => {

          if (answered[qIndex] !== null) return;

          const newAnswered = [...answered];

          newAnswered[qIndex] = oIndex;

          setAnswered(newAnswered);



          if (oIndex === quizData[qIndex].answer) {

            setScore(s => s + 1);

          }

        };



        const getOptionClass = (qIndex, oIndex) => {

          const ans = answered[qIndex];

          const isCorrect = quizData[qIndex].answer === oIndex;



          if (ans === null) return "bg-slate-900 hover:bg-slate-800 text-slate-300 border-slate-700 hover:border-blue-500/50 shadow-md";

          if (isCorrect) return "bg-emerald-900/90 text-emerald-100 border-emerald-500 shadow-[0_0_25px_rgba(16,185,129,0.4)] scale-[1.03] z-10 font-bold";

          if (ans === oIndex && !isCorrect) return "bg-red-900/90 text-red-100 border-red-500 shadow-[0_0_25px_rgba(239,68,68,0.4)]";

          return "bg-slate-950 text-slate-600 border-slate-900 opacity-40";

        };



        return (

          <div className="space-y-16 animate-fade-in pb-10">

            <header className="border-b border-slate-800 pb-8 flex flex-col md:flex-row justify-between md:items-end gap-6">

                <span className="text-slate-500 text-base uppercase tracking-widest font-black">Puntuación Total</span>

                <span className="text-5xl font-black text-amber-500 drop-shadow-xl">{score}<span className="text-3xl text-slate-600 font-normal">/10</span></span>

              </div>

            </header>



            <div className="grid xl:grid-cols-2 gap-12">

              {quizData.map((q, qIndex) => (

                <div key={qIndex} className="bg-slate-900 p-10 rounded-[2.5rem] border border-slate-800 shadow-2xl flex flex-col justify-between overflow-hidden relative transition-all duration-300 hover:border-slate-600">

                  <div className="absolute top-0 right-0 p-4 opacity-5 pointer-events-none text-9xl font-serif font-black">

                    {qIndex + 1}

                  </div>

                  <div className="relative z-10">

                    <h3 className="text-3xl font-medium text-white mb-10 leading-[1.6]">{q.q}</h3>

                    <div className="grid grid-cols-1 gap-5">

                      {q.options.map((opt, oIndex) => (

                        <button

                          key={oIndex}

                          onClick={() => handleAnswer(qIndex, oIndex)}

                          disabled={answered[qIndex] !== null}

                          className={`p-6 rounded-2xl text-left transition-all duration-300 border-2 flex items-center group ${getOptionClass(qIndex, oIndex)}`}

                        >

                          <span className={`font-black mr-5 w-12 h-12 flex-shrink-0 flex items-center justify-center rounded-xl transition-colors text-xl ${answered[qIndex] === null ? 'bg-slate-800 text-slate-400 group-hover:bg-blue-500 group-hover:text-white' : 'bg-black/30 text-white/90'}`}>

                            {['A', 'B', 'C', 'D'][oIndex]}

                          </span>

                          <span className="text-2xl">{opt}</span>



                          {answered[qIndex] !== null && quizData[qIndex].answer === oIndex && (

                            <svg className="w-10 h-10 ml-auto text-emerald-400 drop-shadow-lg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={3} d="M5 13l4 4L19 7" /></svg>

                          )}

                          {answered[qIndex] === oIndex && quizData[qIndex].answer !== oIndex && (

                            <svg className="w-10 h-10 ml-auto text-red-400 drop-shadow-lg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={3} d="M6 18L18 6M6 6l12 12" /></svg>

                          )}

                        </button>

                      ))}

                    </div>

                  </div>



                  <div className={`mt-8 overflow-hidden transition-all duration-[800ms] ease-in-out ${answered[qIndex] !== null ? 'max-h-[800px] opacity-100' : 'max-h-0 opacity-0'}`}>

                    <div className="bg-slate-950 p-8 rounded-2xl border-l-4 border-blue-500 shadow-[inset_0_2px_15px_rgba(0,0,0,0.5)] mt-6 mb-4 relative">

                      <div className="absolute top-4 right-4 text-4xl opacity-20">📚</div>

                      <p className="text-blue-400 font-black uppercase tracking-widest text-sm mb-3">Contexto Histórico</p>

                      <p className="text-slate-300 text-xl leading-relaxed font-light">{q.explanation}</p>

                    <div className="bg-slate-950 p-8 rounded-2xl border-l-4 border-amber-500 shadow-[inset_0_2px_15px_rgba(0,0,0,0.5)] relative">

                      <p className="text-amber-500 font-black uppercase tracking-widest text-sm mb-3">Dato Curioso</p>

                    </div>

                  </div>

                </div>

              ))}

                      onClick={() => setActiveTab(tab.id)}

                      className={`w-full flex items-center px-5 py-5 rounded-2xl transition-all duration-300 font-bold text-lg group ${

                        activeTab === tab.id

                          ? "bg-slate-800 text-amber-400 shadow-lg border border-slate-700/80 scale-[1.02]"

                          : "hover:bg-slate-800/40 text-slate-400 hover:text-slate-200 border border-transparent"

                      }`}

                    >

                      <span className={`text-2xl mr-4 transition-transform duration-300 ${activeTab === tab.id ? 'scale-125 drop-shadow-md' : 'group-hover:scale-125'}`}>{tab.icon}</span>

                      <span className="tracking-wide">{tab.title}</span>

                      {activeTab === tab.id && (

                        <div className="ml-auto w-2 h-2 rounded-full bg-amber-400 animate-pulse shadow-[0_0_10px_#facc15]"></div>

                      )}

                    </button>

                  </li>

                ))}

              </ul>

              <div className="p-6 border-t border-slate-800 text-sm text-slate-500 font-medium text-center bg-slate-950/30 uppercase tracking-widest">

                IES San José de la Rinconada

              </div>

            </nav>



            <main className="flex-1 overflow-y-auto h-screen relative bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-slate-950 scroll-smooth">

              <div className="absolute inset-0 opacity-[0.03] pointer-events-none" style={{ backgroundImage: 'url("data:image/svg+xml,%3Csvg width=\'60\' height=\'60\' viewBox=\'0 0 60 60\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cg fill=\'none\' fill-rule=\'evenodd\'%3E%3Cg fill=\'%23ffffff\' fill-opacity=\'1\'%3E%3Cpath d=\'M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z\'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E")' }}></div>



              <div className="max-w-7xl mx-auto relative z-10 p-8 md:p-14 pb-24">

                {activeTab === 1 && <MorfologiaNominal />}

                {activeTab === 2 && <Pregunta2 />}

                {activeTab === 3 && <SistemaVerbal />}

                {activeTab === 4 && <Pregunta4 />}

                {activeTab === 5 && <Pregunta5 />}

                {activeTab === 6 && <Pregunta6 />}

              </div>

            </main>

          </div>

        );

      }



      const root = ReactDOM.createRoot(document.getElementById('root'));

      root.render(<App />);
    </script>
  </body>
</html>
